# 每日自动生成 AI 实体洞察日报并发布到仓库 + GitHub Pages
# cron: UTC 05:00 = 北京时间 13:00
name: daily-report

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Create .env from secrets
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch news & score (auto-render daily HTML)
        run: uv run python -m src.main fetch

      - name: Ensure daily report HTML
        run: uv run python -m src.main daily --no-deduce

      - name: Build monthly summary (only on the last day of month, Beijing time)
        run: |
          # 调度时间 UTC 05:00 = 北京时间 13:00；当日历日一致。
          # 自动化规则：当月最后一天，跟着当天日报一起生成本月月报。
          Y=$(TZ=Asia/Shanghai date +%Y)
          M=$(TZ=Asia/Shanghai date +%m)
          D=$(TZ=Asia/Shanghai date +%d)
          LAST=$(TZ=Asia/Shanghai date -d "$Y-$M-01 +1 month -1 day" +%d)
          if [ "$D" = "$LAST" ]; then
            echo ">>> 当月最后一天($Y-$M-$D)，生成本月月报"
            uv run python scripts/build_monthly.py "$Y" "$M"
          else
            echo ">>> 非月末($Y-$M-$D)，跳过月报生成"
          fi

      # 卡片截图要靠浏览器渲染，中文靠系统字体：云端的 Linux 机器默认没有中文字体，
      # 不装这一步，截出来的图会是满屏方框。
      - name: Install CJK fonts (for card screenshots)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # 抖音图文 + 公众号文章 + 发布前合规体检报告（只生成，不发布；发布由老许手动完成）
      # 加 continue-on-error：截图失败也不该拖垮当天的日报主线
      - name: Build social content (douyin cards + wechat article)
        continue-on-error: true
        run: uv run python scripts/build_social.py --top 3

      # 素材是图片，长期堆积会把仓库撑大；只保留最近 60 天，旧的连预览页一起清掉
      - name: Prune old social assets (keep 60 days)
        run: |
          CUTOFF=$(date -d "60 days ago" +%Y-%m-%d)
          echo ">>> 保留 $CUTOFF 之后的素材"
          for dir in news-data/social/*/; do
            [ -d "$dir" ] || continue
            b=$(basename "$dir")
            case "$b" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                if [[ "$b" < "$CUTOFF" ]]; then
                  echo "   清理 $b"
                  rm -rf "$dir" "news-data/social-$b.html" "news-data/wechat-$b.html"
                fi ;;
            esac
          done

      - name: Build Pages index (latest report + history nav + monthly links)
        run: uv run python scripts/build_index.py

      - name: Commit & push report
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"
          git add -f config.json news-data/daily-*.html news-data/score-log-*.md index.html scripts/build_index.py scripts/build_monthly.py scripts/build_social.py
          # 月末生成的月报（无则忽略，已提交的历史月报不影响）
          git add -f news-data/monthly-*.html 2>/dev/null || true
          # 图文素材 / 公众号文章 / 合规报告；-A 同时记录上面删掉的老素材
          git add -A -f news-data/social news-data/social-*.html news-data/wechat-*.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: daily report $(date +%F)"
          git push
